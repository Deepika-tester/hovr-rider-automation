# CANADA run: DRIVER app on its own emulator (emulator-5556, AVD HOVR_Driver), GPS in Toronto (GTA marketplace).
# Select with -Dplatform=driver-canada. The OTP bypass (111111) only works for +91 numbers, so drivers sign up with +91
# numbers; the marketplace (and the onboarding checklist) comes from the GPS location.
platformName=Android
automationName=UiAutomator2

appPath=apps/hovr-driver-dev-v6.2.4+592-release.apk

appPackage=com.example.hovr_driver
appActivity=production.hovr.driver.MainActivity

udid=emulator-5556
deviceName=HOVR_Driver
platformVersion=16

appiumServerUrl=http://127.0.0.1:4723

implicitWaitSeconds=10
explicitWaitSeconds=20

noReset=true
fullReset=false

emulatorGeoLat=43.6532
emulatorGeoLng=-79.3832

market=canada
systemPort=8202

# Account-area scenarios
# sign in as this driver (staging OTP 111111) instead of registering a new one each time.
testDriverPhone=9055652565
# Canadian number, so the phone screen keeps its default +1. This is an APPROVED GTA driver (Virat Kholi, dr_021nYJawUhz7fG57zmQ99) supplied by the project owner.
testDriverCountry=+1
# Brand-new Pending GTA driver registered with a +1 number for the onboarding scenarios.
pendingDriverPhone=6475550177
