platformName=iOS
automationName=XCUITest

# Path to the .app (simulator) or .ipa (real device) build under test.
appPath=apps/HovrRider.app

bundleId=com.hovr.rider

# Simulator: use the simulator's name/OS as shown by `xcrun simctl list devices`,
# leave udid blank and Appium will boot/reuse a matching simulator.
# Real device: set udid (from `xcrun xctrace list devices`) and deviceName to match.
udid=
deviceName=iPhone 15
platformVersion=17.5

# Required for real-device runs signed with a team-scoped provisioning profile.
# Leave blank for simulator runs.
xcodeOrgId=
xcodeSigningId=iPhone Developer

# WebDriverAgent local port — bump if running multiple iOS sessions on one host.
wdaLocalPort=8100

appiumServerUrl=http://127.0.0.1:4723

implicitWaitSeconds=10
explicitWaitSeconds=20

noReset=true
fullReset=false
