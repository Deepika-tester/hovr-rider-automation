# Android EMULATOR config for the DRIVER app -- select with -Dplatform=driver-emulator
# (mvn test -Dplatform=driver-emulator -Dtest=DriverTestRunner ...). Same app as driver.properties
# (dev build +592); only the device differs. Boot the AVD first: scripts/start-emulator.sh
platformName=Android
automationName=UiAutomator2

appPath=apps/hovr-driver-dev-v6.2.4+592-release.apk

appPackage=com.example.hovr_driver
appActivity=production.hovr.driver.MainActivity

udid=emulator-5554
deviceName=HOVR_Test
platformVersion=16

appiumServerUrl=http://127.0.0.1:4723

implicitWaitSeconds=10
explicitWaitSeconds=20

noReset=true
fullReset=false

# The emulator forgets its GPS on every restart; the framework re-sets it at session start.
# Mohali, matching the India marketplace.
emulatorGeoLat=30.6781
emulatorGeoLng=76.7230

# Existing, fully registered test driver on the dev backend ("Arjun Mehta", India marketplace). Signing in as
# this driver (phone + the 111111 staging OTP) is how the account-area scenarios skip a 2-minute registration.
testDriverPhone=7428730894
