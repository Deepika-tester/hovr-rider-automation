# Backend API suite config (api_auth/api_dispatch/api_pricing features).
# Independent of config.properties/ios.properties — those are Appium mobile capabilities,
# this is plain HTTP client config for the Go services directly.
#
# Hosts below are per docs/feature-suite-README.md. Point at staging for actual test runs;
# prod is listed here only because it's what the feature files' Background steps reference.
iamBaseUrl=https://iam.api.staging.ridehovr.com
rideBaseUrl=https://ca.ride.api.staging.ridehovr.com
driverBaseUrl=https://ca.driver.api.staging.ridehovr.com

connectTimeoutSeconds=10
readTimeoutSeconds=15

# Populate for scenarios needing an authenticated session (most non-auth endpoints).
# Never commit a real token/secret here — use an env var or CI secret in practice.
testAuthToken=
