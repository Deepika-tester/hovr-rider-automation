# Android EMULATOR config -- select with -Dplatform=emulator (mvn test -Dplatform=emulator ...).
# Same app + capabilities as config.properties (real Samsung); only the device differs.
# Boot it first:  scripts/start-emulator.sh   (HOVR_Test, Android 16 / API 36, Google Play, arm64)
platformName=Android
automationName=UiAutomator2

appPath=apps/hovr-rider-dev-v6.3.0+588-release.apk

appPackage=production.hovr.customer
appActivity=production.hovr.customer.MainActivity

udid=emulator-5554
deviceName=HOVR_Test
platformVersion=16

appiumServerUrl=http://127.0.0.1:4723

implicitWaitSeconds=10
explicitWaitSeconds=20

noReset=true
fullReset=false

# The emulator forgets its GPS on every restart, so the framework re-sets it at session start
# (adb emu geo fix). Mohali, matching the India marketplace the real-device runs use.
emulatorGeoLat=30.6781
emulatorGeoLng=76.7230
